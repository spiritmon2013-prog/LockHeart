<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LockHeart</title>
<meta name="description" content="LockHeart is a trading card game built on a rock-paper-scissors system. Only the strong survive.">
<style>
:root{
  --bg:#14162B; --panel:#2A2E57; --ink:#FFFFFF; --muted:#B9BEE6;
  --blue:#38B6FF; --red:#FF3030; --yellow:#FFDD57; --black:#000;
  --font:"Trebuchet MS","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;font-size:17px}
a{color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

header{padding:14px 0;border-bottom:3px solid var(--black);background:var(--panel)}
header .wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand img{height:34px;display:block}
nav{display:flex;gap:18px;flex:1;font-weight:700}
nav a{text-decoration:none;color:var(--muted);padding:4px 2px}
nav a:hover{color:var(--yellow)}
.lang{display:flex;gap:6px}
.lang button{font:inherit;font-weight:800;font-size:14px;background:var(--bg);color:var(--ink);border:2px solid var(--black);border-radius:8px;padding:4px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--yellow);color:var(--black)}

.hero{padding:56px 0 48px;text-align:center}
.hero .logo{width:min(560px,90%);height:auto;filter:drop-shadow(0 0 22px rgba(56,182,255,.35))}
.tagline{font-size:clamp(19px,3vw,26px);font-weight:700;max-width:620px;margin:14px auto 22px}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;font-weight:800;font-size:18px;padding:12px 26px;border:3px solid var(--black);border-radius:12px;box-shadow:5px 5px 0 var(--red);transition:transform .12s}
.btn:hover{transform:translate(-2px,-2px)}
.btn.play{background:var(--yellow);color:var(--black)}
.btn.cards{background:var(--blue);color:var(--black);box-shadow:5px 5px 0 var(--yellow)}
.online{margin-top:16px;color:var(--muted);font-size:15px}
.online i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--yellow);margin-right:8px}


section{padding:40px 0}
h2{font-size:clamp(26px,4vw,36px);line-height:1.15;margin-bottom:12px}
.lead{max-width:640px;color:var(--muted);margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
.item{background:var(--panel);border:3px solid var(--black);border-radius:14px;padding:18px}
.item:nth-child(1){box-shadow:6px 6px 0 var(--blue)}
.item:nth-child(2){box-shadow:6px 6px 0 var(--red)}
.item:nth-child(3){box-shadow:6px 6px 0 var(--yellow)}
.item:nth-child(4){box-shadow:6px 6px 0 #fff}
.item h3{font-size:20px;margin-bottom:6px}
.item p{color:var(--muted);font-size:16px}

#soon{background:var(--panel);border-top:3px solid var(--black);border-bottom:3px solid var(--black)}
#soon p{color:var(--muted);max-width:560px}

footer{padding:26px 0 40px;color:var(--muted);font-size:15px}
footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
footer a{margin-right:16px}

@media (max-width:640px){
  nav{order:3;flex-basis:100%;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="brand" href="#top" aria-label="LockHeart"><img src="assets/logo.png" alt="LockHeart"></a>
    <nav aria-label="Main">
      <a href="play/" data-i18n="nav_play">Play</a>
      <a href="#soon" data-i18n="nav_cards">Cards</a>
      <a href="#soon" data-i18n="nav_news">News</a>
      <a href="#community" data-i18n="nav_community">Community</a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="pt">PT</button>
    </div>
  </div>
</header>

<main id="top">
  <div class="wrap hero">
    <img class="logo" src="assets/logo.png" alt="LockHeart">
    <p class="tagline" id="tagline"></p>
    <div class="cta">
      <a class="btn play" href="play/" data-i18n="play_now">Play now</a>
      <a class="btn cards" href="#soon" data-i18n="browse_cards">Browse cards</a>
    </div>
    <!-- Later: the live counter will fill #online-count with a number -->
    <p class="online"><i aria-hidden="true"></i><span id="online-count" data-i18n="online_soon">Play against the CPU now. Online matches are coming soon.</span></p>
  </div>

  <section id="about">
    <div class="wrap">
      <h2 data-i18n="about_title">What is LockHeart?</h2>
      <p class="lead" data-i18n="about_body"></p>
      <div class="grid">
        <div class="item"><h3 data-i18n="i1_t">Creatures</h3><p data-i18n="i1_b"></p></div>
        <div class="item"><h3 data-i18n="i2_t">Traits</h3><p data-i18n="i2_b"></p></div>
        <div class="item"><h3 data-i18n="i3_t">Domains</h3><p data-i18n="i3_b"></p></div>
        <div class="item"><h3 data-i18n="i4_t">Spells</h3><p data-i18n="i4_b"></p></div>
      </div>
    </div>
  </section>

  <section id="soon">
    <div class="wrap">
      <h2 data-i18n="soon_title">Cards, News and online matches are on the way</h2>
      <p data-i18n="soon_body"></p>
    </div>
  </section>
</main>

<footer id="community">
  <div class="wrap">
    <div>
      <!-- Replace each # with your real link -->
      <a href="#">Discord</a><a href="#">Instagram</a><a href="#">TikTok</a><a href="#">YouTube</a>
    </div>
    <a href="#" data-i18n="privacy">Privacy</a>
  </div>
</footer>

<script>
// All visible text lives here. To add a language, add one more block.
// To add taglines, add more lines to the "taglines" list of each language.
var T = {
  en:{
    taglines:["A trading card game where every card beats one and loses to another. Only the strong survive."],
    nav_play:"Play", nav_cards:"Cards", nav_news:"News", nav_community:"Community",
    play_now:"Play now", browse_cards:"Browse cards", online_soon:"Play against the CPU now. Online matches are coming soon.",
    about_title:"What is LockHeart?",
    about_body:"A trading card game built on a rock-paper-scissors system: every card is strong against one and weak against another.",
    i1_t:"Creatures", i1_b:"Unleash alien creatures.",
    i2_t:"Traits", i2_b:"Equip powerful traits.",
    i3_t:"Domains", i3_b:"Terraform the battlefield with domain cards.",
    i4_t:"Spells", i4_b:"Outplay your opponent with spells.",
    soon_title:"Cards, News and online matches are on the way",
    soon_body:"We are building the game room, the card gallery and the news page. Check back soon.",
    privacy:"Privacy"
  },
  es:{
    taglines:["Un juego de cartas coleccionables donde cada carta vence a una y pierde contra otra. Solo los fuertes sobreviven."],
    nav_play:"Jugar", nav_cards:"Cartas", nav_news:"Noticias", nav_community:"Comunidad",
    play_now:"Jugar ahora", browse_cards:"Ver cartas", online_soon:"Juega contra la CPU ya. Las partidas en línea llegan pronto.",
    about_title:"¿Qué es LockHeart?",
    about_body:"Un juego de cartas coleccionables basado en un sistema de piedra, papel o tijera: cada carta es fuerte contra una y débil contra otra.",
    i1_t:"Criaturas", i1_b:"Libera criaturas alienígenas.",
    i2_t:"Rasgos", i2_b:"Equipa rasgos poderosos.",
    i3_t:"Dominios", i3_b:"Terraforma el campo de batalla con cartas de dominio.",
    i4_t:"Hechizos", i4_b:"Supera a tu rival con hechizos.",
    soon_title:"Cartas, Noticias y partidas en línea llegan pronto",
    soon_body:"Estamos construyendo la sala de juego, la galería de cartas y la página de noticias. Vuelve pronto.",
    privacy:"Privacidad"
  },
  pt:{
    taglines:["Um jogo de cartas colecionáveis onde cada carta vence uma e perde para outra. Só os fortes sobrevivem."],
    nav_play:"Jogar", nav_cards:"Cartas", nav_news:"Novidades", nav_community:"Comunidade",
    play_now:"Jogar agora", browse_cards:"Ver cartas", online_soon:"Jogue contra a CPU agora. Partidas online chegam em breve.",
    about_title:"O que é o LockHeart?",
    about_body:"Um jogo de cartas colecionáveis baseado em um sistema de pedra, papel e tesoura: cada carta é forte contra uma e fraca contra outra.",
    i1_t:"Criaturas", i1_b:"Libere criaturas alienígenas.",
    i2_t:"Traços", i2_b:"Equipe traços poderosos.",
    i3_t:"Domínios", i3_b:"Terraforme o campo de batalha com cartas de domínio.",
    i4_t:"Feitiços", i4_b:"Supere seu adversário com feitiços.",
    soon_title:"Cartas, Novidades e partidas online chegam em breve",
    soon_body:"Estamos construindo a sala de jogo, a galeria de cartas e a página de novidades. Volte em breve.",
    privacy:"Privacidade"
  }
};

function setLang(l){
  var d = T[l] || T.en;
  document.documentElement.lang = (l === "pt" ? "pt-BR" : l);
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var v = d[el.getAttribute("data-i18n")];
    if (v) el.textContent = v;
  });
  document.getElementById("tagline").textContent = d.taglines[Math.floor(Math.random()*d.taglines.length)];
  document.querySelectorAll(".lang button").forEach(function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-lang") === l ? "true" : "false");
  });
  try { localStorage.setItem("lh-lang", l); } catch(e) {}
}
document.querySelectorAll(".lang button").forEach(function(b){
  b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang")); });
});
var start = "en";
try { start = localStorage.getItem("lh-lang") || ""; } catch(e) {}
if (!T[start]) { start = (navigator.language || "en").slice(0,2); }
setLang(T[start] ? start : "en");
</script>
</body>
</html>
